services:
  traefik:
    image: "traefik:latest"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  php-apache:
    build:
        context: ../php-dockerfile
#SELECT HERE YOUR PHP VERSION FOR YOUR ENVIRONMENT
        dockerfile : php-8.2.Dockerfile
#        dockerfile : php-7.4.Dockerfile

    depends_on:
      - "traefik"
      - "mysql"
    volumes:
  # SELECT HERE THE CORE VERSION OF DOLIBARR
      - "../dolibarr-core/dolibarr-develop:/var/www/html/dolibarr"
      - "../custom:/var/www/html/dolibarr/htdocs/custom"
      - "../conf:/var/www/html/dolibarr/htdocs/conf"
      
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.php-apache.rule=Host(`dlb2003.localhost`) || Host(`localhost`) || Host(`lvh.me`) || Host(`pmamp.lvh.me`) || Host(`127.0.0.1`)"
      - "traefik.http.routers.php-apache.entrypoints=web"
      - "traefik.http.services.php-apache.loadbalancer.server.port=80"

  mysql:
  # SELECT HERE THE VERSION OF MYSQL (or something else)
    image: "mariadb:latest"
    #image: "mysql:8.0.27"
    # Uncomment line below if you are using a Mac with the M1 chip
    #platform: linux/arm64
    depends_on:
      - "traefik"
    volumes:
      #- "./mysql_seed.sql:/docker-entrypoint-initdb.d/mysql_seed.sql"
      - "./dbdata:/var/lib/mysql"
    command:
      - "--default-authentication-plugin=mysql_native_password"
    environment:
      MYSQL_ROOT_PASSWORD: "rootPASS"
      MYSQL_DATABASE: "dolibarr"
      MYSQL_USER: "dbuser"
      MYSQL_PASSWORD: "dbpass"
    labels:
      - "traefik.enable=false"

  phpmyadmin:
  # Change line below if you are using a Mac with the M1 chip : image: "lscr.io/linuxserver/phpmyadmin:latest"
    image: "phpmyadmin/phpmyadmin"
    depends_on:
      - "mysql"
    links:
      - "mysql"
    environment:
      PMA_HOST: "mysql"
      PMA_PORT: "3306"
      UPLOAD_LIMIT: "256M"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`pma.localhost`) || Host(`pma.lvh.me`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"

networks:
  default:
    name: "traefikNetwork"
